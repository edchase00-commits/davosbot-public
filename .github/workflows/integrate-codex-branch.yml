name: integrate-codex-branch

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: davosbot-master-integrator
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'codex/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Integrate green codex branch
        env:
          CODEX_INTEGRATION_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CODEX_INTEGRATION_BRANCH_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/integrate_codex_branch.py
